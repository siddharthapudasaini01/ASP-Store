<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - MyStore</title>
  <style>
    /* Global Styles */
    :root {
      --bg-primary: #eaeded;
      --header-bg: #131921;
      --header-sub-bg: #232f3e;
      --accent-gold: #febd69;
      --accent-yellow: #ffd814;
      --action-green: #28a745;
      --text-dark: #0f1111;
      --text-light: #ffffff;
      --border-color: #ddd;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header Styles */
    .main-header {
      background-color: var(--header-bg);
      color: var(--text-light);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent-gold);
      text-decoration: none;
    }

    .search-bar {
      display: flex;
      flex-grow: 1;
      max-width: 600px;
    }

    .search-bar input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
    }

    .search-bar button {
      background-color: var(--accent-gold);
      border: none;
      padding: 8px 16px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-weight: bold;
    }

    .search-bar button:hover {
      background-color: #f3a847;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: var(--accent-gold);
    }

    .cart-badge {
      background-color: var(--accent-gold);
      color: var(--text-dark);
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 12px;
    }

    /* Main Container & Layout */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
      flex-grow: 1;
      width: 100%;
    }

    .page-title {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .contact-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    /* Cards & Form Elements */
    .form-card, .order-summary-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .form-card h2, .form-card h3, .order-summary-card h2 {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .divider {
      margin: 15px 0;
      border: 0;
      border-top: 1px solid var(--border-color);
    }

    /* Summary Section */
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .summary-row.total {
      font-size: 18px;
      font-weight: bold;
    }

    /* Buttons */
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--accent-yellow);
      color: var(--text-dark);
    }

    .btn-primary:hover {
      background-color: #f7ca00;
    }

    .btn-block {
      width: 100%;
      display: block;
    }

    .btn-lg {
      padding: 12px;
      font-size: 16px;
    }

    /* Footer */
    .footer {
      background-color: var(--header-bg);
      color: var(--text-light);
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      font-size: 13px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header-top {
        flex-direction: column;
      }
      .contact-layout {
        grid-template-columns: 1fr;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="store.js" defer></script>
</head>
<body>
  <header class="main-header">
    <div class="header-top">
      <a href="index.html" class="logo">MyStore</a>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search products...">
        <button id="search-btn">Search</button>
      </div>
      <nav class="nav-links">
        <a href="account.html" id="nav-account">Account & Login</a>
        <a href="orders.html">Orders</a>
        <a href="contact.html">Contact Us</a>
        <a href="cart.html" class="cart-link">Cart <span id="cart-count" class="cart-badge">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Checkout</h1>
    <div class="contact-layout">
      <div class="form-card">
        <h2>Shipping & Payment Details</h2>
        <form id="checkout-form">
          <div class="form-row">
            <div class="form-group">
              <label for="ship-fname">First Name</label>
              <input type="text" id="ship-fname" required>
            </div>
            <div class="form-group">
              <label for="ship-lname">Last Name</label>
              <input type="text" id="ship-lname" required>
            </div>
          </div>
          <div class="form-group">
            <label for="ship-address">Street Address</label>
            <input type="text" id="ship-address" required placeholder="123 Main St">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="ship-city">City</label>
              <input type="text" id="ship-city" required>
            </div>
            <div class="form-group">
              <label for="ship-zip">ZIP / Postal Code</label>
              <input type="text" id="ship-zip" required>
            </div>
          </div>

          <hr class="divider">
          <h3>Payment Method</h3>
          <div class="form-group">
            <label for="card-num">Card Number</label>
            <input type="text" id="card-num" required placeholder="1234 5678 9012 3456">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="card-exp">Expiry Date</label>
              <input type="text" id="card-exp" required placeholder="MM/YY">
            </div>
            <div class="form-group">
              <label for="card-cvv">CVV</label>
              <input type="password" id="card-cvv" maxlength="4" required placeholder="123">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Place Order</button>
        </form>
      </div>

      <div class="order-summary-card">
        <h2>Order Summary</h2>
        <div id="checkout-summary-items"></div>
        <hr class="divider">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="checkout-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>FREE</span>
        </div>
        <hr class="divider">
        <div class="summary-row total">
          <span>Total</span>
          <span id="checkout-total">$0.00</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 MyStore Inc. All rights reserved.</p>
  </footer>
</body>
</html>
