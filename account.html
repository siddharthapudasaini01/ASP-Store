<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Management - MyStore</title>
  <link rel="stylesheet" href="styles.css">
  <script src="store.js" defer></script>
</head>
<body>
  <header class="main-header">
    <div class="header-top">
      <a href="index.html" class="logo">MyStore</a>
      <div class="search-bar">
        <input type="text" placeholder="Search products...">
        <button>Search</button>
      </div>
      <nav class="nav-links">
        <a href="account.html" id="nav-account">Account & Login</a>
        <a href="orders.html">Orders</a>
        <a href="contact.html">Contact Us</a>
        <a href="cart.html" class="cart-link">Cart <span id="cart-count" class="cart-badge">0</span></a>
      </nav>
    </div>
    <div class="header-sub">
      <a href="index.html">All Products</a>
      <a href="#">Today's Deals</a>
      <a href="#">Electronics</a>
      <a href="contact.html">Customer Service</a>
    </div>
  </header>

  <main class="container">
    <div id="login-section" class="form-card">
      <h2>Sign-In</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email or mobile phone number</label>
          <input type="email" id="login-email" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>

    <div id="profile-section" class="profile-card" style="display: none;">
      <h2>User Profile</h2>
      <div class="profile-info">
        <p><strong>Status:</strong> Active Member</p>
        <p><strong>Email:</strong> <span id="user-email-display">user@example.com</span></p>
      </div>
      <button id="logout-btn" class="btn btn-secondary">Sign Out</button>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 MyStore Inc. All rights reserved.</p>
  </footer>
</body>
</html>
